schema_version: 1

journey:
  name: "nWave Ticket Execution Engine"
  goal: "A ticket submitter files a ticket and gets working, verifiable implementation without chasing a developer, while always being able to tell what's happening and intervene if needed."
  persona: "Maria Santos, Senior Product Manager, Fenwick Analytics (primary submitter). Devon Park (Support Engineer) and Carlos Mendes (Customer Success Manager) are alternate submitters. Priya Nair (Engineering Lead) is the governance stakeholder for classification/guardrails."

  emotional_arc:
    start: "Hopeful but wary"
    middle: "Watchful (oscillates between reassured and anxious, driven by visibility of progress)"
    end: "Relieved and confident (happy path) or supported-not-blamed (error path)"

steps:
  - id: 1
    name: "Submit Ticket"
    command: "Maria fills the OrgOps ticket form, or adds a Trello card to the 'Fenwick Product Backlog' board (ingested via the existing trello-cli skill)."

    tui_mockup: |
      +-- OrgOps UI: New Ticket ---------------------------------------------+
      | Title: [Add filter by region to Reports dashboard____________]      |
      | Description: [...free text...]                                     |
      | Source: ( ) OrgOps ticket  (*) Trello card  ( ) Jira issue          |
      |                                        [ Submit Ticket ]           |
      +------------------------------------------------------------------------+

    shared_artifacts:
      - name: "ticket_id"
        source: "ticket intake record (OrgOps-native ticket store, or Trello card id ingested via trello-cli)"
        displayed_as: "${ticket_id}"
        consumers: ["channel title", "classification message", "progress messages", "completion summary", "UI ticket list"]
      - name: "channel_id"
        source: "ticket-scoped OrgOps channel created at intake"
        displayed_as: "${channel_id}"
        consumers: ["all messages/events tied to this ticket", "WS topic subscription for the submitter's browser"]

    emotional_state:
      entry: "Motivated, mildly frustrated by past backlog delays"
      exit: "Hopeful but wary"

    integration_checkpoint: |
      A ticket-scoped channel must exist and the submitter must be subscribed to it before
      classification starts, so every later message has somewhere to land and someone to reach.

    failure_modes:
      - "Ticket has no description — nothing usable to classify against"
      - "Ticket source system unreachable (e.g., Trello API down) and the card can't be ingested"
      - "Duplicate ticket submitted twice (double card sync) creates two channels for one piece of work"

    gherkin: |
      Scenario: Ticket submission creates a ticket-scoped channel
        Given Maria Santos is signed into OrgOps
        When she submits a ticket titled "Add filter by region to Reports dashboard"
        Then a ticket record is created with a unique ticket id
        And a ticket-scoped channel is created and Maria is subscribed to it
        And shared artifact "${ticket_id}" matches source

  - id: 2
    name: "Classification Result Returned"
    command: "System automatically classifies the ticket as development work or not, with a stated rationale."

    tui_mockup: |
      +-- Ticket Channel: TICKET-1043 ----------------------------------------+
      | [System] Classified as: DEVELOPMENT WORK (confidence: high)          |
      |          Rationale: "Describes a UI change to an existing dashboard  |
      |          with a testable outcome. No content-only language detected."|
      +--------------------------------------------------------------------------+

    shared_artifacts:
      - name: "classification_result"
        source: "classifier decision event (ticket.classified)"
        displayed_as: "${classification_result}"
        consumers: ["routing logic (fire nWave or route elsewhere)", "channel message to submitter", "Priya Nair's audit view"]

    emotional_state:
      entry: "Hopeful but wary"
      exit: "Attentive (\"did it get it right?\")"

    integration_checkpoint: |
      Classification result and rationale must be visible before any implementation work
      starts, and must be human-correctable (submitter or Priya can override).

    failure_modes:
      - "Misclassification: a content-only ticket (e.g., 'update pricing page copy') is wrongly classified as development work"
      - "Ambiguous ticket (e.g., 'investigate why nightly sync is slower') produces low-confidence classification requiring human confirmation"
      - "Classification step itself fails/times out with no result posted"

    gherkin: |
      Scenario: Development ticket is classified and routed toward implementation
        Given Devon Park has submitted ticket TICKET-1042 "Export to CSV button throws 500 error on Safari"
        When the classification step runs
        Then TICKET-1042 is classified as "DEVELOPMENT WORK" with a stated rationale
        And the rationale is posted to the ticket's channel
        And shared artifact "${classification_result}" matches source

      Scenario: Non-development ticket is classified away from the engine
        Given Maria Santos has submitted ticket TICKET-1044 "Update Q3 pricing page copy"
        When the classification step runs
        Then TICKET-1044 is classified as "NOT DEVELOPMENT WORK" with a stated rationale
        And Maria is told where this type of ticket should be routed instead
        And no nWave implementation run is triggered for TICKET-1044

  - id: 3
    name: "Implementation Triggered"
    command: "System restates its understanding of the ticket in plain language and, once confirmed, triggers an nWave implementation run."

    tui_mockup: |
      +-- Ticket Channel: TICKET-1043 ----------------------------------------+
      | [System] Understood: "Adds a region filter dropdown to the Reports   |
      |          dashboard, defaulting to the viewer's home region."         |
      | [System] Does this match your intent? [Looks right] [Not quite]      |
      +--------------------------------------------------------------------------+

    shared_artifacts:
      - name: "run_id"
        source: "nWave execution invocation record (mechanism intentionally unspecified pending SPIKE — see wave-decisions.md)"
        displayed_as: "${run_id}"
        consumers: ["progress messages", "process output stream", "completion summary", "produced_artifacts_links"]
      - name: "wave_status"
        source: "wave-progress events emitted during the nWave run (DISCUSS/DESIGN/DISTILL/DELIVER)"
        displayed_as: "${wave_status}"
        consumers: ["progress UI (Step 4)", "channel messages"]

    emotional_state:
      entry: "Attentive"
      exit: "Cautiously trusting (\"ok, it's moving\")"

    integration_checkpoint: |
      The plain-language restatement shown to the submitter must be derived from the same
      ticket text the engine actually uses as its starting input — no drift between what is
      shown and what is executed.

    failure_modes:
      - "Engine cannot be triggered — invocation mechanism unavailable or erroring (this is the SPIKE's core risk)"
      - "Restatement does not match submitter's intent and must be corrected before execution proceeds"
      - "Ticket lacks enough detail to start safely (Prepare job-map gap) and the system should say so instead of guessing"

    gherkin: |
      Scenario: Submitter confirms understood intent before implementation starts
        Given TICKET-1043 has been classified as development work
        When the system posts its plain-language restatement of the ticket's intent
        And Maria Santos confirms "Looks right"
        Then an nWave implementation run is triggered for TICKET-1043
        And shared artifact "${run_id}" is created and shared artifact "${wave_status}" is set to "DISCUSS"

      Scenario: Submitter corrects a misunderstood restatement before execution starts
        Given TICKET-1046 "Add Slack notification when invoice payment fails" has been classified as development work
        When the system posts a restatement that omits which Slack channel to notify
        And Carlos Mendes selects "Not quite" and adds the missing detail
        Then implementation does not start until the corrected understanding is confirmed

  - id: 4
    name: "Progress Monitoring"
    command: "Submitter checks the ticket channel at any time and sees curated wave-by-wave progress plus a live activity signal."

    tui_mockup: |
      +-- Ticket Channel: TICKET-1043 ----------------------------------------+
      | [System] DISCUSS wave complete (4 min) - 6 scenarios defined.        |
      | [System] DESIGN wave in progress - drafted 4 minutes ago.            |
      | [System] DISTILL wave pending.  [System] DELIVER wave pending.       |
      |          Last activity: 90 seconds ago         [View raw output]     |
      +--------------------------------------------------------------------------+

    shared_artifacts:
      - name: "wave_status"
        source: "wave-progress events emitted during the run"
        displayed_as: "${wave_status}"
        consumers: ["channel messages", "OrgOps UI ticket dashboard card"]
      - name: "last_activity_at"
        source: "underlying process/event stream timestamp (process output or wave-progress event, whichever is most recent)"
        displayed_as: "${last_activity_at}"
        consumers: ["progress UI 'Last activity' indicator"]

    emotional_state:
      entry: "Cautiously trusting"
      exit: "Watchful, reassured by real signal (or anxious if silent for an extended period)"

    integration_checkpoint: |
      "Last activity" must be tied to the real underlying process/event stream, never a static
      placeholder. A stale or fake-looking timestamp is worse than showing nothing.

    failure_modes:
      - "Run appears stalled — no wave-progress event for an extended period, with no way to tell 'thinking' from 'stuck'"
      - "Raw output is available but too noisy to be useful without the curated wave-status layer"
      - "Submitter closes the browser tab and has no way to be pulled back in in when something needs them (see Step 5 and US-10)"

    gherkin: |
      "@property"
      Scenario: Wave status reflects real, current run state
        Given an nWave implementation run is active for TICKET-1043
        When Maria Santos opens the ticket channel at any point during the run
        Then the displayed wave status matches the run's actual current wave
        And "Last activity" reflects a real timestamp from the underlying process/event stream

      Scenario: Raw output remains available for a submitter who wants more detail
        Given Maria Santos is viewing curated wave-by-wave progress for TICKET-1043
        When she selects "View raw output"
        Then she sees the underlying process output stream for the active run

  - id: 5
    name: "Mid-Run Intervention"
    command: "Submitter posts a message into the ticket channel at any time; system acknowledges receipt and states when it will be applied."

    tui_mockup: |
      +-- Ticket Channel: TICKET-1043 ----------------------------------------+
      | [Maria] The region filter should default to the viewer's home        |
      |         region, not "All Regions."                                   |
      | [System] Got it. This will be picked up before the DELIVER wave      |
      |          starts. Current wave: DESIGN (unaffected by this note).     |
      +--------------------------------------------------------------------------+

    shared_artifacts:
      - name: "intervention_message"
        source: "submitter-authored channel message"
        displayed_as: "n/a (raw message content)"
        consumers: ["eventHistory for the active run", "whichever wave is active/next when the message arrives"]

    emotional_state:
      entry: "Watchful"
      exit: "In control (\"it's actually listening\")"

    integration_checkpoint: |
      Every acknowledgment must state *when* the note will be honored. An unacknowledged
      message is the fastest way to destroy the trust built during Step 4.

    failure_modes:
      - "Message arrives but is silently dropped — no acknowledgment posted"
      - "Message arrives after the affected wave has already passed, requiring rework instead of simple pickup"
      - "Submitter wants a full pause/halt, not just an added note (see US-09, separate from this step's note-taking)"

    gherkin: |
      Scenario: Mid-run note is acknowledged with a concrete pickup point
        Given an nWave implementation run for TICKET-1043 is in the DESIGN wave
        When Maria Santos posts "the region filter should default to the viewer's home region" into the ticket channel
        Then the system acknowledges the message within the same channel
        And the acknowledgment states which wave will incorporate the note

      Scenario: Submitter is warned when a note affects already-completed work
        Given an nWave implementation run for TICKET-1043 has already completed the DESIGN wave
        When Maria Santos posts a note that changes an architectural assumption made in DESIGN
        Then the system tells her this note requires revisiting completed work
        And states the impact before proceeding

  - id: 6
    name: "Completion & Review"
    command: "System posts a completion summary with links to produced work; submitter approves or requests changes."

    tui_mockup: |
      +-- Ticket Channel: TICKET-1043 ----------------------------------------+
      | [System] Implementation complete (elapsed: 2h 14m).                  |
      |          Summary: Added a region filter dropdown, defaulting to the  |
      |          viewer's home region. Acceptance scenarios: 6/6 passed.     |
      |          Branch: feature/ticket-1043-region-filter                  |
      |          [View changes] [Approve] [Request changes]                  |
      +--------------------------------------------------------------------------+

    shared_artifacts:
      - name: "produced_artifacts_links"
        source: "DELIVER-wave output (branch/PR reference)"
        displayed_as: "${produced_artifacts_links}"
        consumers: ["completion summary", "review step", "OrgOps UI ticket dashboard card"]

    emotional_state:
      entry: "Watchful"
      exit: "Relieved and confident (happy path) or supported-not-blamed (failure summary path)"

    integration_checkpoint: |
      The summary's claims (e.g., "6/6 scenarios passed") must be traceable to the actual
      acceptance scenarios defined earlier in the run — no unverifiable claims shown to the
      submitter.

    failure_modes:
      - "Run fails partway through and there is no completion summary at all (dead silence — the worst outcome)"
      - "Summary overstates what was actually verified"
      - "Submitter requests changes but there is no defined path back into the loop"

    gherkin: |
      Scenario: Submitter receives a verifiable completion summary
        Given the nWave implementation run for TICKET-1043 has finished successfully
        When the system posts the completion summary to the ticket channel
        Then the summary includes a plain-language description of what changed
        And a link to the branch/PR produced
        And the count of acceptance scenarios passed, traceable to the run's defined scenarios

      Scenario: Failed run still produces a clear, non-blaming summary
        Given the nWave implementation run for TICKET-1042 fails during the DELIVER wave
        When the run terminates
        Then the system posts a failure summary to the ticket channel within 2 minutes
        And the summary explains what was completed, what failed, and a suggested next step
        And Devon Park is never shown a raw stack trace without plain-language context

integration_validation:
  shared_artifact_consistency:
    - artifact: "ticket_id"
      must_match_across: [1, 2, 3, 4, 5, 6]
      failure_message: "Ticket id shown in progress/completion messages does not match the id created at intake."
    - artifact: "run_id"
      must_match_across: [3, 4, 5, 6]
      failure_message: "Progress or completion messages reference a run_id that does not match the run triggered in Step 3."
    - artifact: "wave_status"
      must_match_across: [3, 4]
      failure_message: "Displayed wave status does not reflect the run's actual current wave."
    - artifact: "channel_id"
      must_match_across: [1, 2, 3, 4, 5, 6]
      failure_message: "A message intended for this ticket appears in the wrong channel or is not delivered to the subscribed submitter."

changelog:
  - date: "2026-07-21"
    feature: "nwave-ticket-execution-engine"
    change: "Initial DISCUSS-wave journey created. Invocation mechanism (Step 3) intentionally left unspecified pending SPIKE per wave-decisions.md."
