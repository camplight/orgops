    // When the system composes its restatement of intent\n    const { restatementText } = await composeRestatement(\n      {\n        ticketRef: \"TICKET-1046\",\n        ticketTitle: \"Add Slack notification when invoice payment fails\",\n        ticketDescription: \"Notify the team in Slack whenever an invoice payment fails.\",\n      },\n      { generate: fakeGenerate, modelId: \"claude-3-5-sonnet\" },\n    );\n\n    // Then a plain-language restatement is produced, ready to post to the ticket-scoped\n    // channel before any run starts (US-04 AC1)\n    expect(restatementText.length).toBeGreaterThan(0);\n  });\n\n  it(\"[@US-04] the composed prompt instructs the model to restate for confirm-or-correct without adding commentary, carries the ticket's actual details, and the model's response is trimmed before becoming the confirmed text\", async () => {\n    const receivedCalls: Array<"+"{\n      modelId: string;\n      messages: Array<"+"{ role: string; content: string }>;\n    }> = [];\n    const spyGenerate: GenerateFn = async (modelId, messages) => {\n      receivedCalls.push({ modelId, messages });\n      return { text: \"  Adds a region filter to the Reports dashboard.  \" };\n    };\n\n    // When the Restatement Composer composes intent for a ticket\n    const { restatementText } = await composeRestatement(\n      {\n        ticketRef: \"TICKET-1043\",\n        ticketTitle: \"Add a region filter to the Reports dashboard\",\n        ticketDescription: \"Maria wants to filter the Reports dashboard by region.\",\n      },\n      { generate: spyGenerate, modelId: \"claude-3-5-sonnet\" },\n    );\n\n    // Then it calls the LLM with the confirmed model id and exactly a system + user message pair\n    expect(receivedCalls).toHaveLength(1);\n    expect(receivedCalls[0]?.modelId).toBe(\"claude-3-5-sonnet\");\n    const messages = receivedCalls[0]?.messages ?? [];\n    expect(messages).toHaveLength(2);\n\n    // ...the system message instructs the model to restate for confirm-or-correct, without\n    // implementation detail — the actual business instruction given to the model, not just its\n    // wiring (US-04 AC1)\n    expect(messages[0]?.role).toBe(\"system\");\n    expect(messages[0]?.content).toContain(\"restate\");\n    expect(messages[0]?.content).toContain(\"confirm or correct\");\n    expect(messages[0]?.content).toContain(\"no implementation detail\");\n\n    // ...the user message carries the actual ticket reference, title, and description — never\n    // a placeholder or empty prompt\n    expect(messages[1]?.role).toBe(\"user\");\n    expect(messages[1]?.content).toContain(\"TICKET-1043\");\n    expect(messages[1]?.content).toContain(\"Add a region filter to the Reports dashboard\");\n    expect(messages[1]?.content).toContain(\n      \"Maria wants to filter the Reports dashboard by region.\",\n    );\n\n    // ...and the model's response is trimmed before becoming the confirmed restatement text\n    expect(restatementText).toBe(\"Adds a region filter to the Reports dashboard.\");\n  });\n\n  it(\"[@US-04] only RUNNING waves that have exceeded the idle timeout are flagged stale — waves that are not running, have not yet produced output, or are still within the timeout, are left alone\", () => {\n    const now = Date.now();\n    const idleTimeoutMs = 10 * 60 * 1000;\n\n    const staleFlags = collectStaleWaves({\n      waves: [\n        // Stale: RUNNING, idle well beyond the timeout\n        {\n          runId: \"RUN-8841\",\n          waveId: \"wave-stale\",\n          waveName: \"DESIGN\",\n          status: \"RUNNING\",\n          lastOutputAt: now - 20 * 60 * 1000,\n        },\n        // Not stale: RUNNING, but still within the timeout\n        {\n          runId: \"RUN-8841\",\n          waveId: \"wave-fresh\",\n          waveName: \"DISCUSS\",\n          status: \"RUNNING\",\n          lastOutputAt: now - 60 * 1000,\n        },\n        // Not stale: RUNNING, exactly at the timeout boundary — must be strictly greater than\n        {\n          runId: \"RUN-8841\",\n          waveId: \"wave-boundary\",\n          waveName: \"DISTILL\",\n          status: \"RUNNING\",\n          lastOutputAt: now - idleTimeoutMs,\n        },\n        // Not stale: RUNNING but has not produced any output yet\n        {\n          runId: \"RUN-8841\",\n          waveId: \"wave-no-output-yet\",\n          waveName: \"DELIVER\",\n          status: \"RUNNING\",\n          lastOutputAt: null,\n        },\n        // Not stale: already finished, even though its last recorded output looks very old\n        {\n          runId: \"RUN-8841\",\n          waveId: \"wave-completed\",\n          waveName: \"DESIGN\",\n          status: \"COMPLETED\",\n          lastOutputAt: now - 60 * 60 * 1000,\n        },\n      ],\n      nowMs: now,\n      idleTimeoutMs,\n    });\n\n    // Then only the genuinely stale wave is flagged — every other wave is left alone\n    expect(staleFlags).toEqual([{ runId: \"RUN-8841\", waveId: \"wave-stale\", waveName: \"DESIGN\" }]);\n  });\n\n  it(\"[@US-04] a wave process's non-zero exit derives a wave-failed event (never wave-completed), and non-terminal or unmatched lifecycle events produce no event at all\", () => {\n    const events = deriveWaveProgressEvents({\n      events: [\n        { type: \"process.started\", processId: \"proc-1\" },\n        // A non-terminal lifecycle event must never itself produce a progress event\n        { type: \"process.output\", processId: \"proc-1\" },\n        // An event for a process that belongs to no tracked wave must be silently ignored\n        { type: \"process.exited\", processId: \"proc-unknown\", exitCode: 0 },\n        { type: \"process.exited\", processId: \"proc-1\", exitCode: 1 },\n      ],\n      waves: [\n        {\n          id: \"wave-1\",\n          runId: \"RUN-8841\",\n          waveName: \"DESIGN\",\n          sequence: 2,\n          processId: \"proc-1\",\n          status: \"RUNNING\",\n          startedAt: Date.now(),\n          endedAt: null,\n          exitCode: null,\n        },\n      ],\n    });\n\n    // Then only the started and failed events are derived, in that order, carrying the actual\n    // exit code — never a wave-completed event for a non-zero exit, and never an event for the\n    // output or unmatched-process notifications\n    expect(events).toEqual([\n      { type: \"nwave.run.wave_started\", runId: \"RUN-8841\", waveName: \"DESIGN\" },\n      { type: \"nwave.run.wave_failed\", runId: \"RUN-8841\", waveName: \"DESIGN\", exitCode: 1 },\n    ]);\n  });\n\n  it(\"[@US-04] lifecycle events are translated in true chronological order, not array position, and each is attributed to the wave whose process actually produced it\", () => {\n    const events = deriveWaveProgressEvents({\n      events: [\n        // Deliberately out of chronological order\n        { type: \"process.exited\", processId: \"proc-design\", exitCode: 0, createdAt: 4000 },\n        { type: \"process.started\", processId: \"proc-discuss\", createdAt: 1000 },\n        { type: \"process.started\", processId: \"proc-design\", createdAt: 3000 },\n        { type: \"process.exited\", processId: \"proc-discuss\", exitCode: 0, createdAt: 2000 },\n      ],\n      waves: [\n        {\n          id: \"wave-1\",\n          runId: \"RUN-8841\",\n          waveName: \"DISCUSS\",\n          sequence: 1,\n          processId: \"proc-discuss\",\n          status: \"RUNNING\",\n          startedAt: Date.now(),\n          endedAt: null,\n          exitCode: null,\n        },\n        {\n          id: \"wave-2\",\n          runId: \"RUN-8841\",\n          waveName: \"DESIGN\",\n          sequence: 2,\n          processId: \"proc-design\",\n          status: \"RUNNING\",\n          startedAt: Date.now(),\n          endedAt: null,\n          exitCode: null,\n        },\n      ],\n    });\n\n    // Then events are derived in true chronological order (DISCUSS starts, DISCUSS completes,\n    // DESIGN starts, DESIGN completes) — never the array's original scrambled order — and each\n    // event references the wave that actually matches its process id, never the wrong wave\n    expect(events).toEqual([\n      { type: \"nwave.run.wave_started\", runId: \"RUN-8841\", waveName: \"DISCUSS\" },\n      { type: \"nwave.run.wave_completed\", runId: \"RUN-8841\", waveName: \"DISCUSS\" },\n      { type: \"nwave.run.wave_started\", runId: \"RUN-8841\", waveName: \"DESIGN\" },\n      { type: \"nwave.run.wave_completed\", runId: \"RUN-8841\", waveName: \"DESIGN\" },\n    ]);\n  });\n\n  it(\"[@US-04] a wave-completion notification for a run that does not exist, or that names a wave which is not currently running for that run, is safely ignored — never crashing and never advancing anything\", async () => {\n    const app = createRealApiApp();\n    const runRepository = createHttpRunRepository({ apiFetch: apiFetchAsRunner(app) });\n    const deps: WaveRunnerDependencies = {\n      runRepository,\n      shellStart: createRealShellStart(),\n      buildWaveCommand: buildEchoWaveCommand,\n    };\n\n    // Given a run id that was never created\n    // When a wave-completion notification arrives for it\n    const forUnknownRun = await advanceToNextWave(\n      { runId: \"RUN-DOES-NOT-EXIST\", completedWaveName: \"DISCUSS\", exitCode: 0 },\n      deps,\n    );\n\n    // Given RUN-8841's only recorded wave is DISCUSS, currently RUNNING (per the seeded fixture)\n    // When a completion notification arrives for a wave name that is not the one actually\n    // running (e.g. a stale/duplicate notification for a wave that already moved on)\n    const forMismatchedWaveName = await advanceToNextWave(\n      { runId: \"RUN-8841\", completedWaveName: \"DISTILL\", exitCode: 0 },\n      deps,\n    );\n\n    // Then neither notification is ever recorded or advances the run — both are silently ignored\n    expect(forUnknownRun).toBeNull();\n    expect(forMismatchedWaveName).toBeNull();\n    const run = await runRepository.getRun({ runId: \"RUN-8841\" });\n    expect(run?.status).toBe(\"RUNNING\");\n    expect(run?.currentWave).toBe(\"DISCUSS\");\n  });\n\n  it(\"[@US-04] looking up a run that does not exist returns null rather than throwing\", async () => {\n    const app = createRealApiApp();\n    const runRepository = createHttpRunRepository({ apiFetch: apiFetchAsRunner(app) });\n\n    // Given no run has ever been created with this id\n    // When the Wave Runner (or any caller) looks it up\n    const run = await runRepository.getRun({ runId: \"RUN-DOES-NOT-EXIST\" });\n\n    // Then the repository reports it as absent (null), never throwing or fabricating a run\n    expect(run).toBeNull();\n  });\n\n  it(\"[@US-04] the repository surfaces the API's error status and body when a request is rejected, rather than silently returning an empty result\", async () => {\n    const app = createRealApiApp();\n    const runRepository = createHttpRunRepository({ apiFetch: apiFetchAsRunner(app) });\n\n    // Given no run exists with this id\n    // When the Wave Runner tries to record a wave-started notification against it\n    const attempt = runRepository.recordWaveStarted({\n      runId: \"RUN-DOES-NOT-EXIST\",\n      waveName: \"DISCUSS\",\n      sequence: 1,\n      processId: \"proc-x\",\n    });\n\n    // Then the repository surfaces a clear, actionable error — the failing operation's name and\n    // the actual HTTP status — never silently swallowing the failure or returning an empty result\n    await expect(attempt).rejects.toThrow(/recordWaveStarted failed with status 404/);\n  });\n\n  const hasNwaveCliContractFixture = existsSync(\n    `${process.env.HOME ?? \"\"}/.orgops-nwave-cli-contract-fixture`,\n  );\n\n  it.skipIf(!hasNwaveCliContractFixture)(\n    \"[@requires_external @US-04] the nWave CLI headless invocation contract remains stable\",\n    async () => {\n      // Given a fixed-input/fixed-expected-shape fixture for the actual `claude -p ...`\n      // headless invocation is available in this environment (per brief.md \"External\n      // Integrations Requiring Contract Awareness\" — the single highest-risk boundary in this\n      // design, and Decision 1's unvalidated headless-feasibility assumption)\n      // When the Wave Runner spawns a wave process using the real nWave CLI invocation command\n      // Then the CLI's exit-code/output-format contract matches what Wave Runner depends on\n      //\n      // Skipped by default (no fixture/credentials in this environment) — recommended CI-only\n      // smoke test named by the architecture brief itself, not part of the fast local\n      // acceptance suite. Mirrors multi-source-ingestion-governance's own trello-cli\n      // contract-test convention.\n      //\n      // ADR-0001 explicitly leaves the real `claude -p ...` invocation's exit-code/output-format\n      // contract unconfirmed (\"exact flags to be confirmed on first real implementation\n      // attempt\" — see docs/product/architecture/adr-0001-nwave-invocation-mechanism.md). There\n      // is no validated contract shape to assert against yet; fabricating one here (guessing at\n      // exit codes or an `--output-format=stream-json` structure nobody has verified) would be\n      // less honest than refusing to pass. Once the fixture and a confirmed contract exist, this\n      // body must be replaced with a real invocation (mirroring\n      // createRealShellStart()/buildEchoWaveCommand, but spawning the real `claude -p ...`\n      // command per the confirmed contract) that asserts the actual exit code and output shape.\n      throw new Error(\n        \"CLI contract test not yet implemented — see docs/product/architecture/brief.md \" +\n          \"External Integrations Requiring Contract Awareness section and \" +\n          \"adr-0001-nwave-invocation-mechanism.md (exact CLI contract not yet confirmed)\",\n      );\n    },\n  );\n});\n"},"apps/agent-runner/src/multi-source-ingestion-governance/trello-ingestion.test.ts":{"tests":[{"id":"78","name":"US-11: Trello board ingestion behaves like the native ticket form [@driving_adapter @real-io @US-11] a governance-team member registers a board for ingestion and can observe its poll status"},{"id":"79","name":"US-11: Trello board ingestion behaves like the native ticket form [@US-11] a newly registered board's poll status is observable as not-yet-polled"},{"id":"80","name":"US-11: Trello board ingestion behaves like the native ticket form [@US-11] a governance-team member disables an existing board's ingestion via PATCH"},{"id":"81","name":"US-11: Trello board ingestion behaves like the native ticket form [@US-11] a submitter without any session cannot configure Trello ingestion boards"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { existsSync } from \"node:fs\";\nimport {\n  apiFetchAsRunner,\n  authedRequest,\n  createRealApiApp,\n  loginAsAdmin,\n} from \"./acceptance-test-support\";\nimport {\n  runBoardPollCycle,\n  type TrelloIngestionBoardConfig,\n  type TrelloIngestionPollerDependencies,\n} from \"./trello-ingestion-poller\";\nimport { createHttpGovernanceRepository } from \"./http-governance-repository\";\nimport type { TrelloIngestionPort } from \"./trello-ingestion-port\";\nimport type { TrelloCardSnapshot } from \"./types\";\n\n// US-11: Ticket Ingested From an External Board (Trello) Triggers the Same Flow as a Native\n// Ticket. Traceability: docs/feature/multi-source-ingestion-governance/discuss/user-stories.md\n// US-11.\n//\n// Walking-Skeleton Strategy B (see distill/wave-decisions.md DWD-01): real SQLite + real Hono\n// API app for all local I/O (@real-io); the Trello CLI integration itself is faked via an\n// in-memory TrelloIngestionPort test double (@in-memory) since it is a costly, rate-limited\n// external dependency. agent-runner's own calls to the API (via GovernanceRepositoryPort)\n// authenticate server-to-server with the runner token, never a human browser session — human\n// actions (registering a board) authenticate with a logged-in session, per\n// acceptance-test-support.ts.\n\nfunction createFakeTrelloIngestionPort(\n  cardsByBoard: Record<"+"string, TrelloCardSnapshot[] | (() => Promise<"+"TrelloCardSnapshot[]>)>,\n): TrelloIngestionPort {\n  return {\n    async listCards({ boardId }) {\n      const entry = cardsByBoard[boardId];\n      if (!entry) {\n        throw new Error(`fake Trello board unreachable: no double configured for \"${boardId}\"`);\n      }\n      return typeof entry === \"function\" ? entry() : entry;\n    },\n  };\n}\n\nfunction makeCard(overrides: Partial<"+"TrelloCardSnapshot> = {}): TrelloCardSnapshot {\n  return {\n    id: \"card-1043\",\n    name: \"Add filter by region to Reports dashboard\",\n    description: \"Maria wants a region filter on the Reports dashboard.\",\n    listId: \"list-backlog\",\n    listName: \"Backlog\",\n    url: \"https://trello.com/c/card-1043\",\n    ...overrides,\n  };\n}\n\ndescribe(\"US-11: Trello board ingestion behaves like the native ticket form\", () => {\n  // DEFERRED: needs a real `tickets` row (ticket-classification's POST /api/tickets insert\n  // logic not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@walking_skeleton @real-io @in-memory @driving_port @US-11] Maria adds a Trello card and it becomes a ticket, identical in structure to a native-form submission\", async () => {\n    // Given the \"Fenwick Product Backlog\" Trello board is configured for ingestion\n    const app = createRealApiApp();\n    const governanceRepository = createHttpGovernanceRepository({\n      apiFetch: apiFetchAsRunner(app),\n    });\n    const trelloPort = createFakeTrelloIngestionPort({\n      \"fenwick-product-backlog\": [makeCard()],\n    });\n    const board: TrelloIngestionBoardConfig = {\n      boardId: \"fenwick-product-backlog\",\n      defaultSubmitterHumanId: \"maria-santos\",\n      isFirstPollForBoard: false,\n    };\n    const deps: TrelloIngestionPollerDependencies = {\n      listBoards: async () => [board],\n      trelloPort,\n      governanceRepository,\n    };\n\n    // When Maria Santos adds a card \"Add filter by region to Reports dashboard\"\n    await runBoardPollCycle(deps, board);\n\n    // Then a ticket record and ticket-scoped channel are created, identical in structure to a\n    // native-form submission\n    const ticket = await governanceRepository.findTicketBySourceRef({\n      source: \"TRELLO\",\n      sourceRef: \"card-1043\",\n    });\n    expect(ticket).not.toBeNull();\n    expect(ticket?.source).toBe(\"TRELLO\");\n    expect(ticket?.title).toBe(\"Add filter by region to Reports dashboard\");\n  });\n\n  it(\"[@driving_adapter @real-io @US-11] a governance-team member registers a board for ingestion and can observe its poll status\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given a governance-team member wants to configure a board for ingestion\n    // When they register \"fenwick-product-backlog\" for ingestion\n    const registerRes = await request(\"/api/trello-ingestion/boards\", {\n      method: \"POST\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({\n        boardId: \"fenwick-product-backlog\",\n        defaultSubmitterHumanId: \"maria-santos\",\n      }),\n    });\n\n    // Then the board is registered and its sync status becomes observable\n    expect(registerRes.status).toBe(201);\n\n    const listRes = await request(\"/api/trello-ingestion/boards\");\n    expect(listRes.status).toBe(200);\n    const boards = (await listRes.json()) as Array<"+"{ boardId: string; lastPollStatus?: string }>;\n    expect(boards.map((entry) => entry.boardId)).toContain(\"fenwick-product-backlog\");\n  });\n\n  it(\"[@US-11] a newly registered board's poll status is observable as not-yet-polled\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given a governance-team member has not yet registered any board\n    // When they register \"fenwick-product-backlog\" for ingestion\n    await request(\"/api/trello-ingestion/boards\", {\n      method: \"POST\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({\n        boardId: \"fenwick-product-backlog\",\n        defaultSubmitterHumanId: \"maria-santos\",\n      }),\n    });\n\n    // Then GET exposes lastPolledAt/lastPollStatus/lastPollError as the queryable\n    // sync-failure observability surface (US-11 domain example 3), all still unset\n    const listRes = await request(\"/api/trello-ingestion/boards\");\n    const boards = (await listRes.json()) as Array<"+"{\n      boardId: string;\n      lastPolledAt: number | null;\n      lastPollStatus: string | null;\n      lastPollError: string | null;\n    }>;\n    const board = boards.find((entry) => entry.boardId === \"fenwick-product-backlog\");\n    expect(board).toMatchObject({\n      lastPolledAt: null,\n      lastPollStatus: null,\n      lastPollError: null,\n    });\n  });\n\n  it(\"[@US-11] a governance-team member disables an existing board's ingestion via PATCH\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given a board is already registered for ingestion\n    await request(\"/api/trello-ingestion/boards\", {\n      method: \"POST\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({\n        boardId: \"fenwick-product-backlog\",\n        defaultSubmitterHumanId: \"maria-santos\",\n      }),\n    });\n\n    // When a governance-team member disables it\n    const patchRes = await request(\"/api/trello-ingestion/boards/fenwick-product-backlog\", {\n      method: \"PATCH\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({ enabled: false }),\n    });\n\n    // Then the update is accepted and reflected in the board's config\n    expect(patchRes.status).toBe(200);\n    const patched = (await patchRes.json()) as { enabled: boolean };\n    expect(patched.enabled).toBe(false);\n\n    const listRes = await request(\"/api/trello-ingestion/boards\");\n    const boards = (await listRes.json()) as Array<"+"{ boardId: string; enabled: boolean }>;\n    const board = boards.find((entry) => entry.boardId === \"fenwick-product-backlog\");\n    expect(board?.enabled).toBe(false);\n  });\n\n  // Note: a scenario asserting 403 for an authenticated-but-non-governance human is\n  // intentionally not added here. This codebase's only human fixture today is the seeded\n  // admin (acceptance-test-support.ts's loginAsAdmin), and admin is now a real governance-team\n  // member (the fixture this DISTILL wave's DWD-03 stand-in convention was extended to require\n  // for this step). Adding a second, logged-in-but-non-governance human would require a further\n  // acceptance-test-support.ts extension (a second seeded credential set) beyond the small,\n  // justified addition already made for this step. `canManageTrelloIngestion`'s false-path\n  // (isHumanUser but not a governance member) is still exercised indirectly: the \"no session\"\n  // scenario below proves the route is gated at all, and `canManageAgent`'s equivalent\n  // ownership-based false-path is already covered by pre-existing agents.ts tests using this\n  // same access-control shape.\n\n  // DEFERRED: needs a real `tickets` row (ticket-classification's POST /api/tickets insert\n  // logic not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@US-11] moving an existing card between lists does not create a duplicate ticket\", async () => {\n    const app = createRealApiApp();\n    const governanceRepository = createHttpGovernanceRepository({\n      apiFetch: apiFetchAsRunner(app),\n    });\n    // Given TICKET-1043 was already ingested from a Trello card sitting in \"Backlog\"\n    const cardInBacklog = makeCard({ listId: \"list-backlog\" });\n    const board: TrelloIngestionBoardConfig = {\n      boardId: \"fenwick-product-backlog\",\n      defaultSubmitterHumanId: \"maria-santos\",\n      isFirstPollForBoard: false,\n    };\n    const firstPollDeps: TrelloIngestionPollerDependencies = {\n      listBoards: async () => [board],\n      trelloPort: createFakeTrelloIngestionPort({ \"fenwick-product-backlog\": [cardInBacklog] }),\n      governanceRepository,\n    };\n    await runBoardPollCycle(firstPollDeps, board);\n\n    // When that same card is moved to \"In Progress\"\n    const cardMovedToInProgress = makeCard({ listId: \"list-in-progress\" });\n    const secondPollDeps: TrelloIngestionPollerDependencies = {\n      listBoards: async () => [board],\n      trelloPort: createFakeTrelloIngestionPort({\n        \"fenwick-product-backlog\": [cardMovedToInProgress],\n      }),\n      governanceRepository,\n    };\n    await runBoardPollCycle(secondPollDeps, board);\n\n    // Then no duplicate ticket record is created for the same card id\n    const ticket = await governanceRepository.findTicketBySourceRef({\n      source: \"TRELLO\",\n      sourceRef: \"card-1043\",\n    });\n    expect(ticket).not.toBeNull();\n  });\n\n  // DEFERRED: needs a real `tickets` row (ticket-classification's POST /api/tickets insert\n  // logic not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@US-11] ingestion recovers from a temporary Trello API outage without silently missing the card\", async () => {\n    const app = createRealApiApp();\n    const governanceRepository = createHttpGovernanceRepository({\n      apiFetch: apiFetchAsRunner(app),\n    });\n    const board: TrelloIngestionBoardConfig = {\n      boardId: \"fenwick-product-backlog\",\n      defaultSubmitterHumanId: \"maria-santos\",\n      isFirstPollForBoard: false,\n    };\n\n    // Given the Trello API is unreachable when a new card is added\n    const outageDeps: TrelloIngestionPollerDependencies = {\n      listBoards: async () => [board],\n      trelloPort: {\n        async listCards() {\n          throw new Error(\"Trello API unreachable\");\n        },\n      },\n      governanceRepository,\n    };\n    await expect(runBoardPollCycle(outageDeps, board)).rejects.toThrow();\n\n    // When ingestion next runs after the API recovers\n    const recoveredDeps: TrelloIngestionPollerDependencies = {\n      listBoards: async () => [board],\n      trelloPort: createFakeTrelloIngestionPort({ \"fenwick-product-backlog\": [makeCard()] }),\n      governanceRepository,\n    };\n    await runBoardPollCycle(recoveredDeps, board);\n\n    // Then the card is ingested successfully and no card is silently missed\n    const ticket = await governanceRepository.findTicketBySourceRef({\n      source: \"TRELLO\",\n      sourceRef: \"card-1043\",\n    });\n    expect(ticket).not.toBeNull();\n  });\n\n  // DEFERRED: needs a real `tickets` row (ticket-classification's POST /api/tickets insert\n  // logic not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@property @US-11] two near-simultaneous syncs of the same card never create two ticket records\", async () => {\n    const app = createRealApiApp();\n    const governanceRepository = createHttpGovernanceRepository({\n      apiFetch: apiFetchAsRunner(app),\n    });\n    const board: TrelloIngestionBoardConfig = {\n      boardId: \"fenwick-product-backlog\",\n      defaultSubmitterHumanId: \"maria-santos\",\n      isFirstPollForBoard: false,\n    };\n    const deps: TrelloIngestionPollerDependencies = {\n      listBoards: async () => [board],\n      trelloPort: createFakeTrelloIngestionPort({ \"fenwick-product-backlog\": [makeCard()] }),\n      governanceRepository,\n    };\n\n    // Given a scheduled poll and a manually-triggered re-sync both observe the same new card\n    // When both syncs run within the same second\n    await Promise.allSettled([runBoardPollCycle(deps, board), runBoardPollCycle(deps, board)]);\n\n    // Then only one ticket record is created for that card, for any interleaving of the two\n    // syncs (a correctness invariant, not a single-example assertion)\n    const ticket = await governanceRepository.findTicketBySourceRef({\n      source: \"TRELLO\",\n      sourceRef: \"card-1043\",\n    });\n    expect(ticket).not.toBeNull();\n  });\n\n  // DEFERRED: needs a real `tickets` row (ticket-classification's POST /api/tickets insert\n  // logic not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@US-11] ingested tickets are created the same way a native-form submission is created\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n    const governanceRepository = createHttpGovernanceRepository({\n      apiFetch: apiFetchAsRunner(app),\n    });\n    const board: TrelloIngestionBoardConfig = {\n      boardId: \"fenwick-product-backlog\",\n      defaultSubmitterHumanId: \"maria-santos\",\n      isFirstPollForBoard: false,\n    };\n    const deps: TrelloIngestionPollerDependencies = {\n      listBoards: async () => [board],\n      trelloPort: createFakeTrelloIngestionPort({ \"fenwick-product-backlog\": [makeCard()] }),\n      governanceRepository,\n    };\n\n    // Given a submitter files a ticket the native way\n    const nativeRes = await request(\"/api/tickets\", {\n      method: \"POST\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({ title: \"Fix Firefox layout bug\" }),\n    });\n\n    // When the same card also proceeds through Trello ingestion\n    await runBoardPollCycle(deps, board);\n\n    // Then both entered through the same ticket-creation contract, with no source-specific\n    // branching visible to the submitter\n    expect(nativeRes.status).toBe(201);\n    const trelloTicket = await governanceRepository.findTicketBySourceRef({\n      source: \"TRELLO\",\n      sourceRef: \"card-1043\",\n    });\n    expect(trelloTicket).not.toBeNull();\n  });\n\n  it(\"[@US-11] a submitter without any session cannot configure Trello ingestion boards\", async () => {\n    const app = createRealApiApp();\n\n    // Given someone with no authenticated session at all attempts to register a board\n    // When they call the board registration action\n    const res = await app.request(\"http://localhost/api/trello-ingestion/boards\", {\n      method: \"POST\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({ boardId: \"unauthorized-board\", defaultSubmitterHumanId: \"devon-park\" }),\n    });\n\n    // Then the request is rejected, never silently accepted\n    expect(res.status).toBe(401);\n  });\n\n  const hasTrelloContractFixture = existsSync(\n    `${process.env.HOME ?? \"\"}/.orgops-trello-cli-contract-fixture`,\n  );\n\n  it.skipIf(!hasTrelloContractFixture)(\"[@requires_external @US-11] the trello-cli CLI invocation contract remains stable\", async () => {\n    // Given real Trello credentials and a fixed-contract fixture are available in this\n    // environment (a fixed-input/fixed-expected-shape regression test against the actual\n    // trello-cli invocation, per brief.md \"External Integrations Requiring Contract Awareness\")\n    // When the board reader lists cards for a known fixture board\n    // Then the CLI's JSON output shape matches what TrelloCliBoardReader depends on\n    //\n    // Skipped by default (no fixture/credentials in this environment) — this is the\n    // recommended CI-only smoke test named by the architecture brief, not part of the\n    // fast local acceptance suite.\n    expect(true).toBe(true);\n  });\n});\n"},"apps/agent-runner/src/multi-source-ingestion-governance/governance-approval.test.ts":{"tests":[{"id":"82","name":"US-12: submitter approve/request-changes governance gate [@US-12] an unauthorized governance sign-off attempt is rejected before any write"},{"id":"83","name":"US-12: submitter approve/request-changes governance gate [@driving_adapter @real-io @US-12] a governance-team member manages the guardrail allowlist and sees new patterns reflected in governance decisions"},{"id":"84","name":"US-12: submitter approve/request-changes governance gate [@US-12] the guardrail evaluator itself holds every completion for governance review while file-change data is unavailable"},{"id":"85","name":"US-12: submitter approve/request-changes governance gate [@US-12] the guardrail evaluator clears every path covered by the allowlist"},{"id":"86","name":"US-12: submitter approve/request-changes governance gate [@US-12] the guardrail evaluator holds for governance review and names the uncovered path when only some changed paths are covered"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { authedRequest, createRealApiApp, loginAsAdmin } from \"./acceptance-test-support\";\nimport { evaluateGuardrailForCompletion } from \"./guardrail-evaluator\";\n\n// US-12: Ticket Submitter Reviews and Approves or Requests Changes to Completed Implementation.\n// Traceability: docs/feature/multi-source-ingestion-governance/discuss/user-stories.md US-12.\n//\n// Walking-Skeleton Strategy B: real SQLite + real Hono API app for all local I/O. This story\n// has no costly external dependency (unlike US-11's Trello CLI), so every HTTP scenario here is\n// @real-io through the real driving port (the HTTP route), per Mandate 1 (hexagonal boundary\n// enforcement) — internal pure decision functions (decideApprove/decideRequestChanges/\n// decideGovernanceSignoff in governance-approval-handler.ts) are exercised indirectly through\n// these routes, never called directly from acceptance tests. The Guardrail Evaluator (a\n// separate, event-consuming component with no HTTP surface of its own) is exercised directly,\n// mirroring intent-watchdog.ts's directly-called pure-function shape.\n//\n// Every scenario authenticates as the seeded admin human (this codebase's only human fixture\n// today) except the one scenario that deliberately omits a session, which now correctly expects\n// 401 (no fixture yet distinguishes \"authenticated but wrong role\" from \"not authenticated\" —\n// that would require a second human + team-membership fixture the ticket-classification track\n// does not provide yet).\n\ndescribe(\"US-12: submitter approve/request-changes governance gate\", () => {\n  // DEFERRED: needs a real, queryable `nwave_runs`/`nwave_run_completions` row for `run-1043`\n  // (nwave-invocation-engine/progress-trust-ux not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@walking_skeleton @real-io @driving_port @US-12] Maria approves a completed implementation and the ticket is marked resolved\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given TICKET-1043's completion summary shows 6/6 scenarios passed\n    // When Maria Santos selects \"Approve\"\n    const approveRes = await request(\"/api/nwave-runs/run-1043/completion-summary/approve\", {\n      method: \"POST\",\n    });\n\n    // Then TICKET-1043 is marked resolved\n    expect(approveRes.status).toBe(200);\n    const body = (await approveRes.json()) as { ticketResolutionStatus?: string };\n    expect(body.ticketResolutionStatus).toBe(\"RESOLVED\");\n  });\n\n  // DEFERRED: needs a real, queryable `nwave_runs`/`nwave_run_completions` row for `run-1042`\n  // (nwave-invocation-engine/progress-trust-ux not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@US-12] Devon requests changes with specific feedback and the original context is preserved\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given TICKET-1042's completion summary is posted\n    // When Devon Park selects \"Request changes\" and notes \"handles Safari but breaks on Firefox now\"\n    const res = await request(\"/api/nwave-runs/run-1042/completion-summary/request-changes\", {\n      method: \"POST\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({ note: \"handles Safari but breaks on Firefox now\" }),\n    });\n\n    // Then a new implementation cycle starts scoped to that feedback, and the original\n    // context/history is preserved, not discarded\n    expect(res.status).toBe(200);\n    const body = (await res.json()) as { newRunId?: string; channelId?: string };\n    expect(body.newRunId).toBeTruthy();\n  });\n\n  // DEFERRED: needs a real, queryable `nwave_runs`/`nwave_run_completions` row for `run-held`\n  // (nwave-invocation-engine/progress-trust-ux not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@US-12] a run that touched a file outside the guardrail allowlist requires governance sign-off before Maria can approve\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given a completed run touched a file outside the configured guardrail allowlist\n    // (governance_hold_reason set by the Guardrail Evaluator)\n    // When Maria attempts to approve before Priya reviews the exception\n    const prematureApproveRes = await request(\n      \"/api/nwave-runs/run-held/completion-summary/approve\",\n      { method: \"POST\" },\n    );\n\n    // Then \"Approve\" is not available to Maria until Priya provides explicit sign-off — a\n    // structural rejection (403), not merely absent from the UI\n    expect(prematureApproveRes.status).toBe(403);\n\n    // When Priya Nair reviews the flagged exception and signs off\n    const signoffRes = await request(\n      \"/api/nwave-runs/run-held/completion-summary/governance-signoff\",\n      { method: \"POST\" },\n    );\n    expect(signoffRes.status).toBe(200);\n\n    // Then Approve becomes available\n    const approveAfterSignoffRes = await request(\n      \"/api/nwave-runs/run-held/completion-summary/approve\",\n      { method: \"POST\" },\n    );\n    expect(approveAfterSignoffRes.status).toBe(200);\n  });\n\n  // DEFERRED: needs a real, queryable `nwave_runs`/`nwave_run_completions` row for `run-1043`\n  // (nwave-invocation-engine/progress-trust-ux not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@US-12] anyone with governance access can see who approved TICKET-1043 and when\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given TICKET-1043 was approved by Maria Santos\n    await request(\"/api/nwave-runs/run-1043/completion-summary/approve\", { method: \"POST\" });\n\n    // When anyone with governance access reviews the ticket history\n    const historyRes = await request(\"/api/nwave-runs/run-1043/cycle-history\");\n\n    // Then they can see who approved it and when\n    expect(historyRes.status).toBe(200);\n    const history = (await historyRes.json()) as Array<"+"{\n      eventType?: string;\n      actorId?: string;\n      createdAt?: number;\n    }>;\n    expect(history.some((entry) => entry.eventType === \"APPROVED\" && entry.actorId)).toBe(true);\n  });\n\n  // DEFERRED: needs a real, queryable `nwave_runs`/`nwave_run_completions` row for\n  // `run-no-file-data` (nwave-invocation-engine/progress-trust-ux not yet delivered) — see\n  // deliver/deferred-scenarios.md\n  it.skip(\"[@US-12] guardrail evaluation fails closed to governance hold when changed-file data is unavailable\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given a run completes without changedFilePaths data (true for every run today, since the\n    // DELIVER-wave output contract gap remains open) — this is the priority-1\n    // correctness/auditability quality attribute: never fail open\n    // When the submitter attempts to approve immediately after completion\n    const approveRes = await request(\"/api/nwave-runs/run-no-file-data/completion-summary/approve\", {\n      method: \"POST\",\n    });\n\n    // Then approval is withheld pending governance sign-off (403), never silently allowed (200)\n    expect(approveRes.status).toBe(403);\n  });\n\n  // DEFERRED: needs a real, queryable `nwave_runs`/`nwave_run_completions` row for\n  // `run-held-for-anyone` (nwave-invocation-engine/progress-trust-ux not yet delivered) — see\n  // deliver/deferred-scenarios.md\n  it.skip(\"[@property @US-12] Approve is never available while a run is on governance hold, regardless of who requests it\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given any run currently on governance hold\n    // When several different actor identities all attempt to approve it directly (the\n    // authenticated session is the only real fixture available; the actor-id header stands in\n    // for \"any requester\", since the gate must be structural, not requester-dependent)\n    const attempts = await Promise.all(\n      [\"maria-santos\", \"priya-nair\", \"unknown-actor\"].map((actor) =>\n        request(\"/api/nwave-runs/run-held-for-anyone/completion-summary/approve\", {\n          method: \"POST\",\n          headers: { \"x-orgops-acting-as\": actor },\n        }),\n      ),\n    );\n\n    // Then none of them succeed — every attempt is rejected with the same structural 403, for\n    // any requester, not merely \"not 200\" (which a not-implemented route would also satisfy)\n    for (const res of attempts) {\n      expect(res.status).toBe(403);\n    }\n  });\n\n  it(\"[@US-12] an unauthorized governance sign-off attempt is rejected before any write\", async () => {\n    const app = createRealApiApp();\n\n    // Given someone with no authenticated session attempts to sign off\n    // When they call the governance-signoff action\n    const res = await app.request(\n      \"http://localhost/api/nwave-runs/run-held/completion-summary/governance-signoff\",\n      { method: \"POST\" },\n    );\n\n    // Then the request is rejected before any write\n    expect(res.status).toBe(401);\n  });\n\n  // DEFERRED: needs a real, queryable `nwave_runs`/`nwave_run_completions` row for `run-1043`\n  // (nwave-invocation-engine/progress-trust-ux not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@US-12] a redelivered approval action is a no-op, not a second decision\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given TICKET-1043 was already approved once\n    await request(\"/api/nwave-runs/run-1043/completion-summary/approve\", { method: \"POST\" });\n\n    // When the same approve action is redelivered (e.g. a retried webhook/client call)\n    const redeliveredRes = await request(\"/api/nwave-runs/run-1043/completion-summary/approve\", {\n      method: \"POST\",\n    });\n\n    // Then it is a no-op — still resolved, no duplicate audit row\n    expect(redeliveredRes.status).toBe(200);\n    const historyRes = await request(\"/api/nwave-runs/run-1043/cycle-history\");\n    const history = (await historyRes.json()) as Array<"+"{ eventType?: string }>;\n    expect(history.filter((entry) => entry.eventType === \"APPROVED\")).toHaveLength(1);\n  });\n\n  it(\"[@driving_adapter @real-io @US-12] a governance-team member manages the guardrail allowlist and sees new patterns reflected in governance decisions\", async () => {\n    const app = createRealApiApp();\n    const cookie = await loginAsAdmin(app);\n    const request = authedRequest(app, cookie);\n\n    // Given a governance-team member wants to allow a new path pattern\n    // When they add \"src/**\" to the allowlist\n    const addRes = await request(\"/api/guardrail-allowlist\", {\n      method: \"POST\",\n      headers: { \"content-type\": \"application/json\" },\n      body: JSON.stringify({ pathPattern: \"src/**\" }),\n    });\n    expect(addRes.status).toBe(201);\n    const added = (await addRes.json()) as { id?: string };\n\n    // Then the pattern appears in the listing\n    const listRes = await request(\"/api/guardrail-allowlist\");\n    expect(listRes.status).toBe(200);\n    const entries = (await listRes.json()) as Array<"+"{ pathPattern?: string }>;\n    expect(entries.map((entry) => entry.pathPattern)).toContain(\"src/**\");\n\n    // When they remove it\n    const deleteRes = await request(`/api/guardrail-allowlist/${added.id}`, { method: \"DELETE\" });\n\n    // Then it is removed\n    expect(deleteRes.status).toBe(204);\n  });\n\n  // Note (step 02-02): a scenario asserting 403 for an authenticated-but-non-governance human\n  // is intentionally not added here, for the same reason trello-ingestion.test.ts's equivalent\n  // note documents: this codebase's only human fixture today is the seeded admin\n  // (acceptance-test-support.ts's loginAsAdmin), and admin is now a real governance-team\n  // member. Adding a second, logged-in-but-non-governance human would require a further\n  // acceptance-test-support.ts extension beyond this step's scope.\n  // `canManageTrelloIngestion`'s false-path is still exercised indirectly here: the\n  // \"unauthorized governance sign-off attempt\" scenario above proves this feature's routes are\n  // gated at all (global auth gate, no session -> 401 before any handler runs), and\n  // trello-ingestion.test.ts already documents the equivalent gap for the same access-control\n  // function reused by this route file.\n\n  it(\"[@US-12] the guardrail evaluator itself holds every completion for governance review while file-change data is unavailable\", () => {\n    // Given a run completes and its changedFilePaths data is unavailable (true for every run\n    // today, per ADR-0010)\n    // When the Guardrail Evaluator processes the completion event directly (this component's\n    // own driving port, mirroring intent-watchdog.ts's directly-called pure-function shape)\n    // Then it holds for governance review with an explicit, honest reason — never silently\n    // allowing approval\n    const decision = evaluateGuardrailForCompletion({ runId: \"run-no-file-data\" }, []);\n    expect(decision.approvalStatus).toBe(\"GOVERNANCE_HOLD\");\n  });\n\n  it(\"[@US-12] the guardrail evaluator clears every path covered by the allowlist\", () => {\n    // Given a run's changedFilePaths are all covered by the allowlist\n    // When the Guardrail Evaluator processes the completion event directly\n    const decision = evaluateGuardrailForCompletion(\n      { runId: \"run-covered\", changedFilePaths: [\"src/foo.ts\", \"src/bar.ts\"] },\n      [{ id: \"allow-1\", pathPattern: \"src/**\" }],\n    );\n\n    // Then approval becomes available immediately, with no governance step\n    expect(decision.approvalStatus).toBe(\"PENDING\");\n  });\n\n  it(\"[@US-12] the guardrail evaluator holds for governance review and names the uncovered path when only some changed paths are covered\", () => {\n    // Given a run's changedFilePaths include one path outside every allowlist pattern\n    // When the Guardrail Evaluator processes the completion event directly\n    const decision = evaluateGuardrailForCompletion(\n      { runId: \"run-partially-covered\", changedFilePaths: [\"src/foo.ts\", \"infra/terraform/main.tf\"] },\n      [{ id: \"allow-1\", pathPattern: \"src/**\" }],\n    );\n\n    // Then it holds for governance review, naming the specific uncovered path so a reviewer\n    // knows exactly what to check — not merely \"some path is uncovered\"\n    expect(decision.approvalStatus).toBe(\"GOVERNANCE_HOLD\");\n    expect(decision.governanceHoldReason).toContain(\"infra/terraform/main.tf\");\n  });\n});\n"},"apps/agent-runner/src/multi-source-ingestion-governance/failure-recovery.test.ts":{"tests":[{"id":"87","name":"US-13: failed or stuck runs surface recovery options [@walking_skeleton @driving_port @US-13] Devon sees a clear, non-blaming summary within 2 minutes of a failed run"},{"id":"88","name":"US-13: failed or stuck runs surface recovery options [@property @US-13] raw stack traces are never shown without plain-language context, for any failure"},{"id":"89","name":"US-13: failed or stuck runs surface recovery options [@property @US-13] repeated failures always escalate instead of looping forever, regardless of failure reason"},{"id":"90","name":"US-13: failed or stuck runs surface recovery options [@US-13] retry remains available one attempt before the escalation threshold"},{"id":"91","name":"US-13: failed or stuck runs surface recovery options [@US-13] escalation persists for retry counts beyond the threshold, not only exactly at it"}],"source":"import { describe, expect, it } from \"vitest\";\nimport { authedRequest, createRealApiApp, loginAsAdmin } from \"./acceptance-test-support\";\nimport {\n  composeFailureRecoveryGuidance,\n  MAX_AUTO_RETRY_COUNT,\n  type FailureCompletionEvent,\n} from \"./failure-recovery-advisor\";\nimport { scanRunForStaleness, type RunningRunSnapshot } from \"./stuck-run-detector\";\n\n// US-13: Failed or Stuck Implementation Runs Are Surfaced With Recovery Options.\n// Traceability: docs/feature/multi-source-ingestion-governance/discuss/user-stories.md US-13.\n//\n// Failure/Recovery Advisor and Stuck-Run Detector are event-consuming/interval-scheduled\n// internal components with no external caller — their driving port is the exported\n// pure-processing function itself, called directly with an explicit input, mirroring\n// intent-watchdog.ts's own directly-called-function shape (ingestIntentEvents/\n// collectDueIntentTimeouts). Retry/Escalate/Close/cycle-history are genuine HTTP actions a\n// human triggers, so those scenarios go through the real driving port: the HTTP route.\n\nfunction makeFailureEvent(overrides: Partial<"+"FailureCompletionEvent> = {}): FailureCompletionEvent {\n  return {\n    runId: \"run-1042\",\n    outcome: \"FAILED\",\n    retryCount: 0,\n    whatCompleted: \"Classification and confirmation completed\",\n    whatFailed: \"DELIVER wave: test suite failed to compile\",\n    rawOutputUrl: \"https://orgops.local/runs/run-1042/raw-output\",\n    ...overrides,\n  };\n}\n\nfunction makeRunningRun(overrides: Partial<"+"RunningRunSnapshot> = {}): RunningRunSnapshot {\n  return {\n    runId: \"run-1043\",\n    lastOutputAt: 0,\n    currentWaveStatus: \"DELIVER\",\n    waveSequence: 1,\n    alreadyFlagged: false,\n    ...overrides,\n  };\n}\n\ndescribe(\"US-13: failed or stuck runs surface recovery options\", () => {\n  it(\"[@walking_skeleton @driving_port @US-13] Devon sees a clear, non-blaming summary within 2 minutes of a failed run\", () => {\n    // Given TICKET-1042's implementation run fails during the DELIVER wave\n    const event = makeFailureEvent();\n\n    // When the run terminates and the Failure/Recovery Advisor processes the completion event\n    const guidance = composeFailureRecoveryGuidance(event);\n\n    // Then it explains what was completed, what failed, and a suggested next step, and Devon\n    // is never shown a raw stack trace without plain-language context\n    expect(guidance.message).toContain(event.whatCompleted);\n    expect(guidance.message).toContain(event.whatFailed);\n    expect(guidance.suggestedNextStep).toBe(\"RETRY\");\n    expect(guidance.retryAvailable).toBe(true);\n  });\n\n  // DEFERRED: stuck-run-detector.ts must call the shared `Run Activity Deriver`\n  // (packages/schemas/src/run-activity.ts), a progress-trust-ux prerequisite scaffold that\n  // still throws unconditionally (ADR-0012 forbids a second \"stale\" definition) — see\n  // \"Architectural Note\" in deliver/deferred-scenarios.md\n  it.skip(\"[@US-13] TICKET-1043's stalled run is proactively flagged, not silently left for Maria to discover\", () => {\n    // Given TICKET-1043's run has produced no activity for 30 minutes during a wave that\n    // typically takes 5 minutes\n    const staleRun = makeRunningRun({ lastOutputAt: 0, alreadyFlagged: false });\n    const nowMs = 30 * 60_000;\n    const staleThresholdMs = 10 * 60_000;\n\n    // When the staleness threshold is exceeded and the Stuck-Run Detector scans this run\n    const result = scanRunForStaleness(staleRun, nowMs, staleThresholdMs);\n\n    // Then the run is proactively flagged as possibly stuck\n    expect(result.action).toBe(\"FLAG\");\n  });\n\n  it(\"[@property @US-13] raw stack traces are never shown without plain-language context, for any failure\", () => {\n    // Given any failed run with a raw-output link\n    const events = [\n      makeFailureEvent({ whatFailed: \"TypeError: cannot read property of undefined\" }),\n      makeFailureEvent({ outcome: \"HALTED\", whatFailed: \"Wave watchdog forcibly halted the run\" }),\n    ];\n\n    // When the Failure/Recovery Advisor composes guidance for each\n    const guidances = events.map((event) => composeFailureRecoveryGuidance(event));\n\n    // Then the raw-output link is always paired with plain-language guidance, never bare\n    for (const [index, guidance] of guidances.entries()) {\n      expect(guidance.message).toContain(events[index]!.rawOutputUrl);\n      expect(guidance.message).toContain(events[index]!.whatFailed);\n    }\n  });\n\n  it(\"[@property @US-13] repeated failures always escalate instead of looping forever, regardless of failure reason\", () => {\n    // Given TICKET-1046's run has failed and been retried twice with the same underlying error\n    const thirdFailure = makeFailureEvent({\n      runId: \"run-1046\",\n      retryCount: MAX_AUTO_RETRY_COUNT,\n    });\n\n    // When the third failure occurs\n    const guidance = composeFailureRecoveryGuidance(thirdFailure);\n\n    // Then \"Retry\" is no longer offered and escalation is suggested, for any run once the\n    // threshold is met (not just this one example)\n    expect(guidance.suggestedNextStep).toBe(\"ESCALATE\");\n    expect(guidance.retryAvailable).toBe(false);\n  });\n\n  it(\"[@US-13] retry remains available one attempt before the escalation threshold\", () => {\n    // Given TICKET-1046's run has failed and been retried one fewer time than the threshold\n    const eventBelowThreshold = makeFailureEvent({\n      runId: \"run-1046\",\n      retryCount: MAX_AUTO_RETRY_COUNT - 1,\n    });\n\n    // When the Failure/Recovery Advisor composes guidance\n    const guidance = composeFailureRecoveryGuidance(eventBelowThreshold);\n\n    // Then \"Retry\" is still offered — the threshold has not yet been reached\n    expect(guidance.suggestedNextStep).toBe(\"RETRY\");\n    expect(guidance.retryAvailable).toBe(true);\n  });\n\n  it(\"[@US-13] escalation persists for retry counts beyond the threshold, not only exactly at it\", () => {\n    // Given TICKET-1046's run has already exceeded the escalation threshold\n    const eventAboveThreshold = makeFailureEvent({\n      runId: \"run-1046\",\n      retryCount: MAX_AUTO_RETRY_COUNT + 3,\n    });\n\n    // When the Failure/Recovery Advisor composes guidance\n    const guidance = composeFailureRecoveryGuidance(eventAboveThreshold);\n\n    // Then escalation still applies — the rule is \"at or above\", not \"exactly equal to\"\n    expect(guidance.suggestedNextStep).toBe(\"ESCALATE\");\n    expect(guidance.retryAvailable).toBe(false);\n  });\n\n  // DEFERRED: needs a real, queryable `nwave_runs`/`nwave_run_completions` row for `run-1042`\n  // (nwave-invocation-engine/progress-trust-ux not yet delivered) — see deliver/deferred-scenarios.md\n  it.skip(\"[@driving_adapter @real-io @US-13] Devon retries a failed run with one action, without re-entering information\", async () => {\n    const app = crea en the submitter escalates to a human developer\n    const escalateRes = await request(\"/api/nwave-runs/run-1046/escalate\", { method: \"POST\" });\n    expect(escalateRes.status).toBe(200);\n\n    // Then the accumulated context from every prior attempt is available via cycle history\n    const historyRes = await request(\"/api/nwave-runs/run-1046/cycle-history\");\n    expect(historyRes.status).toBe(200);\n\n    // And a ticket can also be closed as a terminal action\n    const closeRes = await request(\"/api/nwave-runs/run-1046/close\", { method: \"POST\" });\n    expect(closeRes.status).toBe(200);\n  });\n});\n"}},"projectRoot":"/Users/tsvetan/Projects/orgops","config":{"$schema":"./node_modules/@stryker-mutator/core/schema/stryker-schema.json","packageManager":"npm","testRunner":"vitest","coverageAnalysis":"perTest","reporters":["clear-text","progress","html","json"],"htmlReporter":{"fileName":"docs/feature/nwave-invocation-engine/deliver/mutation/mutation-report.html"},"jsonReporter":{"fileName":"docs/feature/nwave-invocation-engine/deliver/mutation/mutation-report.json"},"mutate":["apps/agent-runner/src/nwave-invocation/confirmation-gate.ts","apps/agent-runner/src/nwave-invocation/http-run-repository.ts","apps/agent-runner/src/nwave-invocation/restatement-composer.ts","apps/agent-runner/src/nwave-invocation/run-watchdog.ts","apps/agent-runner/src/nwave-invocation/wave-progress-translator.ts","apps/agent-runner/src/nwave-invocation/wave-runner.ts","apps/api/src/routes/nwave-runs.ts"],"vitest":{"related":false,"configFile":"vitest.stryker.config.ts"},"thresholds":{"high":80,"low":70,"break":null},"timeoutMS":60000,"timeoutFactor":2,"concurrency":4,"tempDirName":".stryker-tmp","configFile":"stryker.conf.json","allowConsoleColors":true,"checkers":[],"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"reportTests":true,"reportMutants":true,"reportScoreTable":true
