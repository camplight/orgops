name: OpsCLI Smoke (Cross-OS)

on:
  pull_request:
    paths:
      - "apps/opscli/**"
      - ".github/workflows/opscli-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    name: "${{ matrix.os }} / Node ${{ matrix.node_version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node_version: 22
          - os: macos-latest
            node_version: 22
          # Keep Windows on Node 20 for better native module/node-gyp stability.
          - os: windows-2022
            node_version: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: OpsCLI tests
        run: npm run --workspace @orgops/opscli test

      - name: Build self-contained OpsCLI executable
        run: npm run --workspace @orgops/opscli build:release

      - name: Smoke test binary (help, doctor, mocked install)
        # install smoke uses ORGOPS_OPSCLI_INSTALL_SMOKE_MOCK in script to avoid
        # network clone, npm build, service registration, and browser side-effects.
        run: node apps/opscli/scripts/ci-smoke.mjs
